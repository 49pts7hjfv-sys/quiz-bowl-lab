<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Bowl Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@700;800;900&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400&display=swap">
<style>
/* Layout: a binder rail on the left (player card + library by content area) and a packet page on the right.
   Buzz Mode turns the page into a match table with a lockout buzzer; flashcards sit on the same table. */
:root {
  --bg: #F2F4F8;          /* cool scoresheet paper */
  --surface: #FFFFFF;
  --surface-2: #E9EDF4;
  --ink: #141B2E;          /* ballpoint navy */
  --muted: #56617A;
  --line: #D5DBE6;
  --pen: #2350C4;          /* blue pen: links and actions */
  --pen-ink: #FFFFFF;
  --pen-soft: #E0E7FA;
  --buzz: #D93A22;         /* the buzzer */
  --buzz-ring: rgba(217, 58, 34, 0.26);
  --gold: #8F5D00;         /* power: text on light */
  --gold-fill: #F5B73B;    /* power: fills */
  --gold-soft: #FFF1CC;
  --good: #17784C;
  --good-soft: #DCF2E6;
  --bad: #B3322A;
  --bad-soft: #FBE3E0;
  --ruled: #C9D6EC;        /* notebook lines */
  --margin: #E7A49A;       /* notebook margin line */
  --shadow: 0 1px 2px rgba(20, 27, 46, 0.06), 0 6px 18px rgba(20, 27, 46, 0.07);
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-packet: "Literata", Georgia, "Times New Roman", serif;
  --r: 12px;
  --r-sm: 8px;
  --topbar-h: 61px;        /* phone top bar: 40px menu button + padding + border */
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1220; --surface: #141B2E; --surface-2: #1B2440; --ink: #E7EBF5; --muted: #9BA6C1; --line: #29344F;
    --pen: #8AA9FF; --pen-ink: #0D1220; --pen-soft: #1D2A50; --buzz: #FF5B41; --buzz-ring: rgba(255, 91, 65, 0.30);
    --gold: #F3BB4E; --gold-fill: #F3BB4E; --gold-soft: #3A2E10; --good: #52CC90; --good-soft: #133426;
    --bad: #FF7466; --bad-soft: #3E1C19; --ruled: #26324F; --margin: #6A3A36;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1220; --surface: #141B2E; --surface-2: #1B2440; --ink: #E7EBF5; --muted: #9BA6C1; --line: #29344F;
  --pen: #8AA9FF; --pen-ink: #0D1220; --pen-soft: #1D2A50; --buzz: #FF5B41; --buzz-ring: rgba(255, 91, 65, 0.30);
  --gold: #F3BB4E; --gold-fill: #F3BB4E; --gold-soft: #3A2E10; --good: #52CC90; --good-soft: #133426;
  --bad: #FF7466; --bad-soft: #3E1C19; --ruled: #26324F; --margin: #6A3A36;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--pen); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 0.92em; }
.display { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; letter-spacing: 0.01em; line-height: 0.92; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 288px minmax(0, 1fr); align-content: start; min-height: 100%; } /* rows keep their height on short pages */
.rail {
  position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 22px 16px 24px; display: flex; flex-direction: column; gap: 20px;
}
.main { min-width: 0; padding-block: 32px 72px; padding-inline: clamp(16px, 4vw, 52px); outline: none; }
.page { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
.topbar { display: none; }
.scrim { display: none; }

.brand { display: flex; flex-direction: column; gap: 2px; padding-inline: 6px; }
.brand-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--buzz); }
.brand-name { font-family: var(--f-display); font-weight: 900; font-size: 34px; line-height: 0.9; text-transform: uppercase; }
.brand-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

.player { background: var(--surface-2); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.player-top { display: flex; align-items: baseline; gap: 8px; }
.lv { font-family: var(--f-display); font-weight: 800; font-size: 20px; text-transform: uppercase; }
.lv-title { font-size: 14px; font-weight: 700; color: var(--pen); }
.xpbar { height: 8px; border-radius: 99px; background: var(--surface); overflow: hidden; }
.xpbar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--pen), var(--gold-fill)); border-radius: 99px; transition: width 0.4s ease; }
.player-meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.player-stats { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.streak { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--muted); }
.streak svg { width: 16px; height: 16px; }
.streak.on { color: var(--buzz); }
.pgn { font-variant-numeric: tabular-nums; font-size: 14px; }
.pgn small { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; margin-left: 2px; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 9px 10px; border: 0; border-radius: var(--r-sm); background: transparent; font-weight: 700; font-size: 15px;
}
.nav-btn svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.nav-btn:hover { background: var(--surface-2); }
.nav-btn.is-active { background: var(--pen-soft); color: var(--pen); }
.nav-btn.is-active svg { color: var(--pen); }

.library { display: flex; flex-direction: column; gap: 2px; }
.lib-empty { display: flex; flex-direction: column; gap: 8px; padding: 6px 6px 10px; }
.lib-empty p { font-size: 13px; color: var(--muted); margin: 0; }
.lib-area-h {
  display: flex; align-items: center; gap: 6px; width: 100%; padding: 9px 10px 5px; border: 0; background: transparent; text-align: left;
}
.lib-area-h .chev { width: 13px; height: 13px; color: var(--muted); flex: none; transition: transform 0.15s ease; }
.lib-area-h[aria-expanded="true"] .chev { transform: rotate(90deg); }
.lib-area-name { font-size: 11.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-area-count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lib-area-count .of { opacity: 0.7; }
.lib-area-body { display: flex; flex-direction: column; gap: 2px; }
.lib-title { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--buzz); padding: 0 10px 2px; }
.lib-soon { display: flex; align-items: center; gap: 6px; width: 100%; padding: 7px 10px 7px 16px; border: 0; border-radius: var(--r-sm); background: transparent; text-align: left; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.lib-soon:hover { background: var(--surface-2); }
.lib-soon .chev { width: 12px; height: 12px; flex: none; transition: transform 0.15s ease; }
.lib-soon[aria-expanded="true"] .chev { transform: rotate(90deg); }
.lib-soon-body { display: flex; flex-direction: column; gap: 2px; }
.lib-item {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px;
  width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: var(--r-sm); background: transparent;
}
.lib-item:hover { background: var(--surface-2); }
.lib-item.is-active { background: var(--pen-soft); }
.lib-item.is-upcoming { opacity: 0.55; }
.lib-item.is-upcoming .tag-soon { margin-left: auto; }
.tag-soon { display: inline-flex; align-items: center; flex: none; border-radius: 99px; padding: 2px 8px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: var(--surface-2); color: var(--muted); }
.mono {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
  font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: 0.02em;
  background: var(--ink); color: var(--bg);
}
.lib-name { display: flex; flex-direction: column; font-weight: 700; font-size: 14.5px; line-height: 1.2; min-width: 0; }
.lib-name small { font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
.ring { width: 26px; height: 26px; }
.ring circle { fill: none; stroke-width: 3.5; }
.ring-bg { stroke: var(--line); }
.ring-fg { stroke: var(--good); stroke-linecap: round; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-inline: 6px; }
.theme-btn { align-self: flex-start; border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
.rail-note { font-size: 12px; color: var(--muted); line-height: 1.45; }

/* ---------- buttons, pills ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface);
  font-weight: 700; font-size: 15px; text-decoration: none; color: var(--ink); line-height: 1.2;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:hover { border-color: var(--pen); }
.btn-pen { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); }
.btn-pen:hover { filter: brightness(1.08); }
.btn-buzz { background: var(--buzz); border-color: var(--buzz); color: #FFFFFF; }
.btn-buzz:hover { filter: brightness(1.06); border-color: var(--buzz); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 6px 12px; font-size: 13.5px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill-stock { background: var(--gold-soft); color: var(--gold); }
.pill-once { background: var(--surface-2); color: var(--muted); font-weight: 400; }
.pill-rabbit { background: var(--pen-soft); color: var(--pen); }
.pill-freq { background: var(--pen-soft); color: var(--pen); }
.pill-tier { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
.pill-tier.t-giveaway { background: var(--good-soft); color: var(--good); }
.pill-tier.t-middle { background: var(--pen-soft); color: var(--pen); }
.pill-tier.t-power { background: var(--gold-soft); color: var(--gold); }

/* ---------- section scaffolding ---------- */
.sec { display: flex; flex-direction: column; gap: 14px; }
.sec-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--buzz); }
.sec h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 4vw, 36px); text-transform: uppercase; line-height: 0.95; }
.sec h3.h3 { font-size: 18px; }
.sec-note { color: var(--muted); max-width: 68ch; }
.sec-note b { color: var(--ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }

/* ---------- home ---------- */
.home-head { display: flex; flex-direction: column; gap: 12px; }
.home-head h1 { font-size: clamp(48px, 8vw, 84px); }
.lede { font-size: 19px; max-width: 60ch; }
.next-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 20px 22px; }
.next-card .mono { width: 56px; height: 56px; font-size: 22px; background: var(--buzz); color: #FFFFFF; }
.next-card .eyebrow { color: var(--gold-fill); }
.next-card h2 { font-family: var(--f-display); font-weight: 800; font-size: 32px; text-transform: uppercase; line-height: 1; }
.next-card p { opacity: 0.85; font-size: 14.5px; }
.next-card .btn { border-color: transparent; }
.pick-card { display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border-radius: var(--r); border: 2px dashed var(--pen); background: var(--pen-soft); }
.pick-card h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; text-transform: uppercase; line-height: 1; }
.pick-card p { max-width: 60ch; }
.pick-card .btn { align-self: flex-start; border-color: transparent; }
.routine { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; counter-reset: step; }
.routine li { counter-increment: step; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
.routine li::before { content: counter(step); font-family: var(--f-display); font-weight: 900; font-size: 30px; line-height: 1; color: var(--buzz); }
.routine b { font-size: 15.5px; }
.pace { margin-top: 12px; padding: 12px 14px; background: var(--gold-soft); border-radius: var(--r-sm); font-size: 15px; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.lib-card {
  display: flex; flex-direction: column; gap: 10px; text-align: left; padding: 16px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.lib-card:hover { border-color: var(--pen); }
.lib-card.is-upcoming { opacity: 0.6; box-shadow: none; cursor: default; }
.lib-card-top { display: flex; align-items: center; gap: 12px; }
.lib-card .lc-name { display: block; font-weight: 700; font-size: 18px; line-height: 1.15; }
.lib-card .kick { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.meter { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--good); border-radius: 99px; }
.lib-card .meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lib-card.tile-more, .lib-card.tile-soon { justify-content: center; gap: 4px; min-height: 112px; background: transparent; border-style: dashed; box-shadow: none; }
.lib-card.tile-more .lc-name { color: var(--pen); }
.lib-card.tile-soon .lc-name { color: var(--muted); }
.lib-card.tile-soon .tag-soon { align-self: flex-start; margin-bottom: 2px; }
.sec h2 .sec-count { font-family: var(--f-body); font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: 6px; white-space: nowrap; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.mode-tile { display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.mode-tile:hover { border-color: var(--pen); }
.mode-tile .mode-icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--buzz); color: #FFFFFF; }
.mode-tile.cards .mode-icon { background: var(--pen); color: var(--pen-ink); }
.mode-tile .mode-icon svg { width: 22px; height: 22px; }
.mode-tile .mt-name { font-family: var(--f-display); font-weight: 800; font-size: 24px; text-transform: uppercase; line-height: 1; }
.mode-tile .mt-text { color: var(--muted); font-size: 14.5px; }
.fineprint { font-size: 13px; color: var(--muted); max-width: 72ch; }

/* ---------- topic page ---------- */
.topic-head { display: flex; flex-direction: column; gap: 12px; }
.topic-head h1 { font-size: clamp(48px, 8.5vw, 92px); }
.kicker { font-size: 17px; color: var(--muted); }
.answer-chip { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 10px; align-self: flex-start; max-width: 100%; padding: 8px 14px; border: 1px dashed var(--line); border-radius: var(--r-sm); background: var(--surface); font-family: var(--f-packet); font-size: 16px; }
.answer-tag { font-family: var(--f-body); font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.step { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 700; text-align: left; }
.step .step-n { display: inline-grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--line); font-size: 12px; color: var(--muted); }
.step.done { background: var(--good-soft); border-color: transparent; color: var(--good); }
.step.done .step-n { background: var(--good); border-color: var(--good); color: var(--surface); }
.step.auto { cursor: default; }
.step-l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.lead { font-size: 20px; line-height: 1.55; max-width: 64ch; }
.media-group { display: flex; flex-direction: column; gap: 10px; }
.media-group + .media-group { margin-top: 8px; }
.media-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.media-h small { font-size: 13.5px; font-weight: 400; color: var(--muted); }
.media { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.media-more .media-card { background: transparent; border-style: dashed; }
.media-card {
  position: relative; display: flex; flex-direction: column; gap: 4px; padding: 14px 40px 14px 14px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none;
}
.media-card:hover { border-color: var(--pen); }
.media-kind { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--buzz); }
.media-kind.k-article, .media-kind.k-wiki { color: var(--pen); }
.media-kind.k-museum { color: var(--good); }
.media-title { font-weight: 700; font-size: 16px; line-height: 1.25; }
.media-src { font-size: 13.5px; color: var(--muted); }
.media-note { font-size: 13px; color: var(--muted); }
.media-go { position: absolute; top: 12px; right: 14px; color: var(--muted); font-size: 18px; }

.qbsearch { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; padding: 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.qb-fields { margin: 0; display: grid; gap: 8px; }
.qb-fields > div { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.qb-fields dt { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.qb-fields dd { margin: 0; font-weight: 700; }
.qb-fields code { background: var(--surface-2); padding: 2px 8px; border-radius: 6px; }
.qb-side { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.qb-found { font-size: 14.5px; }
.qb-freq { font-size: 13.5px; font-weight: 700; color: var(--pen); }
.qb-tip { font-size: 14px; color: var(--muted); }

.tu-tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tu-list { display: flex; flex-direction: column; gap: 14px; }
.tu { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.tu-h { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; background: var(--surface-2); font-size: 12.5px; }
.tu-n { font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.tu-meta { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tu-say { margin-left: auto; display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.tu-say svg { width: 16px; height: 16px; }
.tu-say.on { background: var(--buzz); border-color: var(--buzz); color: #FFFFFF; }
.tu-q { padding: 14px 16px 12px; font-family: var(--f-packet); font-size: 17px; line-height: 1.65; }
.tu-q b { font-weight: 700; }
.pg { font-family: var(--f-body); font-size: 0.82em; color: var(--muted); }
.tu-a { padding: 10px 16px 12px; border-top: 1px dashed var(--line); font-family: var(--f-packet); font-size: 15.5px; }
.tu-a-tag { font-family: var(--f-body); font-weight: 700; font-size: 12px; letter-spacing: 0.1em; }
.hide-answers .tu-a { display: none; }

/* notebook */
.notebook {
  --lh: 30px;
  position: relative; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); overflow: hidden;
}
.nb-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 12px 16px 10px 56px; border-bottom: 2px solid var(--margin); }
.nb-title { font-family: var(--f-display); font-weight: 800; font-size: 22px; text-transform: uppercase; }
.nb-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nb-text {
  display: block; width: 100%; min-height: calc(var(--lh) * 11); resize: vertical; border: 0; outline: none;
  padding: 4px 16px 12px 56px; font-size: 17px; line-height: var(--lh); color: var(--ink);
  background-color: var(--surface);
  background-image:
    linear-gradient(90deg, transparent 43px, var(--margin) 43px, var(--margin) 45px, transparent 45px),
    repeating-linear-gradient(180deg, transparent 0, transparent calc(var(--lh) - 1px), var(--ruled) calc(var(--lh) - 1px), var(--ruled) var(--lh));
  background-attachment: local;
  background-position: 0 4px;
}
.nb-text::placeholder { color: var(--muted); opacity: 0.8; }
.notebook:focus-within { border-color: var(--pen); }
.check-result { padding: 12px 14px; border-radius: var(--r-sm); background: var(--good-soft); color: var(--ink); font-size: 15px; }
.check-result.warn { background: var(--gold-soft); }

/* clue breakdown */
.bd { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 6px 0 14px; }
.bd-tier { display: flex; align-items: baseline; gap: 10px; padding: 14px 18px 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
.bd-tier.t-giveaway { color: var(--good); }
.bd-tier.t-middle { color: var(--pen); }
.bd-tier.t-power { color: var(--gold); }
.bd-tier small { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); font-size: 13px; }
.bd-list { list-style: none; margin: 0; padding: 0 18px; display: flex; flex-direction: column; }
.bd-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--surface-2); }
.bd-list li:last-child { border-bottom: 0; }
.bd-mark { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--line); font-size: 12px; font-weight: 700; }
.bd-list li.got .bd-mark { background: var(--good); border-color: var(--good); color: var(--surface); }
.bd-list li.miss .bd-mark { border-color: var(--buzz); }
.bd-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bd-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.powerline { position: relative; margin: 14px 0 4px; height: 0; border-top: 3px dashed var(--gold-fill); }
.powerline span { position: absolute; left: 18px; top: -12px; background: var(--surface); padding: 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
.locked { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: start; padding: 20px; border-radius: var(--r); border: 2px dashed var(--line); background: var(--surface); }
.locked svg { width: 34px; height: 34px; color: var(--muted); }
.locked p + p { margin-top: 6px; }

/* buzzer trap */
.trap { border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.trap-band {
  padding: 8px 16px; font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink);
  background: repeating-linear-gradient(-45deg, var(--gold-fill) 0 16px, var(--gold-soft) 16px 32px);
}
.trap-band span { background: var(--surface); padding: 2px 10px; border-radius: 6px; }
.trap-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.trap-body h3 { font-size: 21px; }
.trap-fix { padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); }
.trap-line { font-family: var(--f-packet); font-size: 15px; color: var(--muted); }

.drill-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.drill-card { display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.drill-card h3 { font-family: var(--f-display); font-weight: 800; font-size: 24px; text-transform: uppercase; }
.drill-card p { color: var(--muted); font-size: 14.5px; }
.drill-card .btn { align-self: flex-start; margin-top: 4px; }
.drill-stat { font-variant-numeric: tabular-nums; color: var(--ink) !important; font-weight: 700; }

/* ---------- topics page ---------- */
.list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.list-card { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.list-card-top { display: flex; justify-content: space-between; align-items: baseline; }
.list-n { font-family: var(--f-display); font-weight: 800; font-size: 17px; text-transform: uppercase; }
.list-label { font-size: 14.5px; line-height: 1.3; flex: 1; }
.list-ready { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.list-card .btn { align-self: flex-start; margin-top: 2px; }
.list-card .btn.is-in { background: var(--good-soft); border-color: transparent; color: var(--good); }
.sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }
.my-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.my-count { font-weight: 700; font-variant-numeric: tabular-nums; }
.topics-tools { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.search { width: 100%; min-width: 0; padding: 10px 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 13px; font-size: 13.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.chip:hover { border-color: var(--pen); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.topics-status { font-size: 14px; color: var(--muted); margin: -4px 0 12px; }
/* each area is a card: a header that opens it (counts, Select all / Clear), and its rows once opened */
.topics-area { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.topics-area + .topics-area { margin-top: 10px; }
.topics-area[hidden] { display: none; }
.topics-area-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; padding: 8px 12px 8px 6px; border-radius: calc(var(--r) - 1px); background: var(--surface); }
/* an open area's header stays in view while its rows scroll by (Clear / Select all / collapse) */
.topics-area.is-open .topics-area-h { position: sticky; top: 0; z-index: 2; border-radius: calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0; border-bottom: 1px solid var(--line); }
.ta-toggle { flex: 1 1 260px; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; padding: 6px; border: 0; border-radius: var(--r-sm); background: transparent; text-align: left; }
.ta-toggle:hover { background: var(--surface-2); }
.ta-toggle .chev { width: 14px; height: 14px; color: var(--muted); flex: none; transition: transform 0.15s ease; }
.ta-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.ta-toggle.locked-open { cursor: default; }
.ta-toggle.locked-open:hover { background: transparent; }
.ta-name { font-family: var(--f-display); font-weight: 800; font-size: 19px; line-height: 1.1; text-transform: uppercase; }
.ta-meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ta-meta b { color: var(--pen); }
.ta-actions { display: flex; gap: 6px; flex: none; }
.topic-rows { list-style: none; margin: 0; padding: 0; }
.topic-row { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--surface-2); }
.topic-row:last-child { border-bottom: 0; }
.topic-more { display: flex; justify-content: center; padding: 8px 12px; }
.trow-aka { font-size: 12px; font-style: italic; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.topic-row .my-check { width: 17px; height: 17px; accent-color: var(--pen); flex: none; }
.topic-row .mono { width: 30px; height: 30px; font-size: 12px; flex: none; }
.trow-main { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.topic-row-name { font-weight: 700; font-size: 14.5px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; color: var(--ink); }
a.topic-row-name:hover { color: var(--pen); }
span.topic-row-name { color: var(--muted); }
.topic-row-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.topic-row.is-upcoming { opacity: 0.75; }

/* ---------- buzz mode ---------- */
.setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .label { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.field select, .field input[type="text"], .field textarea {
  padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); min-width: 0; width: 100%;
}
.field input[type="range"] { width: 100%; accent-color: var(--pen); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 3px; background: var(--surface); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 99px; font-size: 14px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--bg); }
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.rule { padding: 12px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.rule b { font-family: var(--f-display); font-weight: 900; font-size: 30px; line-height: 1; }
.rule.r-power b { color: var(--gold); }
.rule.r-ten b { color: var(--good); }
.rule.r-neg b { color: var(--bad); }

.stage { display: flex; flex-direction: column; gap: 16px; }
.scorebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--r); background: var(--ink); color: var(--bg); }
.scorebar .sb-left { display: flex; flex-direction: column; font-size: 13px; opacity: 0.85; }
.scorebar .sb-left b { font-family: var(--f-display); font-size: 22px; opacity: 1; }
.scorebar .sb-score { font-family: var(--f-display); font-weight: 900; font-size: 52px; line-height: 0.9; font-variant-numeric: tabular-nums; text-align: center; }
.scorebar .sb-right { display: flex; justify-content: flex-end; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; }
.lamp { width: 18px; height: 18px; border-radius: 50%; background: #3A4256; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.15); }
.stage.buzzed .lamp { background: var(--buzz); box-shadow: 0 0 0 4px var(--buzz-ring), 0 0 16px var(--buzz); }
.zone { align-self: flex-start; padding: 5px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; background: var(--gold-soft); color: var(--gold); }
.zone.off { background: var(--pen-soft); color: var(--pen); }
.zone.dead { background: var(--surface-2); color: var(--muted); }
.reader {
  min-height: 210px; padding: 20px 22px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line);
  font-family: var(--f-packet); font-size: clamp(18px, 2.3vw, 22px); line-height: 1.7;
}
.reader .cursor { display: inline-block; width: 0.5em; height: 1.05em; margin-left: 2px; vertical-align: -0.15em; background: var(--buzz); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.reader .tu-label { display: block; font-family: var(--f-body); font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; width: 100%; background: var(--muted); transform-origin: left; }
.bar.run > span { animation: drain var(--dur, 5s) linear forwards; }
.bar.urgent > span { background: var(--buzz); }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

.buzz-zone { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
.buzzer {
  width: 150px; height: 150px; border-radius: 50%; border: 0;
  background: radial-gradient(circle at 35% 30%, #FF8A70, var(--buzz) 55%, #9E2412);
  color: #FFFFFF; font-family: var(--f-display); font-weight: 900; font-size: 34px; letter-spacing: 0.06em;
  box-shadow: 0 10px 0 #7A1C0E, 0 14px 24px rgba(0, 0, 0, 0.25), 0 0 0 10px var(--buzz-ring);
  transition: transform 0.06s ease, box-shadow 0.06s ease;
}
.buzzer:active, .stage.buzzed .buzzer { transform: translateY(8px); box-shadow: 0 2px 0 #7A1C0E, 0 4px 10px rgba(0, 0, 0, 0.25), 0 0 0 10px var(--buzz-ring); }
.buzzer[disabled] { filter: grayscale(0.6) brightness(0.9); cursor: default; }
.buzz-help { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 14.5px; }
.kbd { display: inline-block; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--line); border-bottom-width: 2px; font-size: 12.5px; font-weight: 700; color: var(--ink); background: var(--surface); }
.answer-row { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--r); border: 2px solid var(--buzz); background: var(--surface); }
.answer-row label { font-weight: 700; }
.answer-input { display: flex; gap: 10px; }
.answer-input input { flex: 1; min-width: 0; padding: 12px 14px; font-size: 18px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); }
.prompt-note { font-weight: 700; color: var(--gold); }
.verdict { display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.verdict-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 12px; }
.verdict-title { font-family: var(--f-display); font-weight: 900; font-size: 44px; line-height: 0.9; text-transform: uppercase; }
.verdict-pts { font-family: var(--f-display); font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; }
.v-power .verdict-title, .v-power .verdict-pts { color: var(--gold); }
.v-ten .verdict-title, .v-ten .verdict-pts { color: var(--good); }
.v-neg .verdict-title, .v-neg .verdict-pts { color: var(--bad); }
.v-miss .verdict-title, .v-dead .verdict-title { color: var(--muted); }
.v-power { border-color: var(--gold-fill); background: linear-gradient(180deg, var(--gold-soft), var(--surface) 70%); }
.v-ten { border-color: var(--good); }
.v-neg { border-color: var(--bad); }
.said { font-size: 15px; }
.said b { font-family: var(--f-packet); }
.full-q { font-family: var(--f-packet); font-size: 16.5px; line-height: 1.7; padding: 12px 14px; border-radius: var(--r-sm); background: var(--bg); }
.bz-mark { display: inline-block; padding: 0 6px; border-radius: 5px; background: var(--buzz); color: #FFFFFF; font-family: var(--f-body); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; vertical-align: 2px; }
.other-hint { font-size: 14.5px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--gold-soft); }
.summary-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; padding: 22px; border-radius: var(--r); background: var(--ink); color: var(--bg); }
.summary-hero .big { font-family: var(--f-display); font-weight: 900; font-size: 88px; line-height: 0.85; font-variant-numeric: tabular-nums; }
.summary-hero .lbl { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; }
.summary-hero .line { font-size: 18px; font-variant-numeric: tabular-nums; }
.missed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.missed li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); }

/* ---------- flashcards ---------- */
.fc-wrap { display: flex; flex-direction: column; gap: 16px; align-items: stretch; }
.fc-status { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fc-scene { perspective: 1400px; }
.fc-card { position: relative; min-height: 300px; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(0.3, 0.7, 0.3, 1); cursor: pointer; }
.fc-card.flipped { transform: rotateY(180deg); }
.fc-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
  padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 14px; overflow: auto;
}
.fc-back { transform: rotateY(180deg); background: var(--surface); }
.fc-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.fc-clue { font-family: var(--f-packet); font-size: clamp(20px, 2.8vw, 26px); line-height: 1.5; }
.fc-clue.small { font-size: 16px; color: var(--muted); }
.fc-big { font-family: var(--f-display); font-weight: 900; font-size: clamp(40px, 7vw, 64px); line-height: 0.95; text-transform: uppercase; }
.fc-hint { margin-top: auto; font-size: 13.5px; color: var(--muted); }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 3px solid var(--buzz); color: transparent; }
.fc-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
.fc-list .tierhead { list-style: none; margin-left: -20px; margin-top: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.fc-actions { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; }
.fc-again { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.fc-got { background: var(--good-soft); border-color: transparent; color: var(--good); }
.empty { padding: 28px; border-radius: var(--r); border: 2px dashed var(--line); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* ---------- stats ---------- */
.stats-area + .stats-area { margin-top: 18px; }
.stats-area h3.h3 { margin-bottom: 8px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--f-display); font-weight: 900; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--surface-2); white-space: nowrap; }
th { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
.stats-topic { color: var(--ink); font-weight: 700; text-decoration: none; }
.stats-topic:hover { color: var(--pen); text-decoration: underline; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--bad-soft); }

/* ---------- loading and load errors (topic content is fetched on demand) ---------- */
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; animation: fade-in 0.3s ease 0.25s both; }
.loading-dot { width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--pen); animation: pulse 1s ease-in-out infinite; }
.skeleton { display: flex; flex-direction: column; gap: 12px; max-width: 64ch; animation: fade-in 0.3s ease 0.25s both; }
.skeleton span { display: block; height: 14px; border-radius: 99px; background: var(--surface-2); }
.skeleton span:nth-child(1) { width: 94%; }
.skeleton span:nth-child(2) { width: 86%; }
.skeleton span:nth-child(3) { width: 90%; }
.skeleton span:nth-child(4) { width: 58%; }
.fc-loading { justify-content: center; padding: 28px; border-radius: var(--r); border: 2px dashed var(--line); }
@keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.load-error { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: start; padding: 20px; border-radius: var(--r); border: 2px dashed var(--bad); background: var(--surface); }
.load-error > svg { width: 34px; height: 34px; color: var(--bad); }
.load-error p + p { margin-top: 4px; }
.load-error .row { margin-top: 14px; }
.verdict.v-error { padding: 0; border: 0; background: transparent; }
.linkish { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; color: var(--pen); text-decoration: underline; text-underline-offset: 2px; }
.between { justify-content: space-between; }
.hint { font-size: 13px; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono svg { width: 24px; height: 24px; }
.mono.m3 { font-size: 12.5px; letter-spacing: 0; }
.next-card .mono.m3 { font-size: 18px; }
.fc-card.tall { min-height: 500px; }
textarea.code { display: block; width: 100%; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; min-height: 96px; resize: vertical; }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: 14.5px;
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 60; max-width: calc(100vw - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- small screens ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .topbar {
    display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
    min-height: var(--topbar-h); padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .menu-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
  .menu-btn svg { width: 20px; height: 20px; }
  .tb-brand { font-family: var(--f-display); font-weight: 900; font-size: 22px; text-transform: uppercase; }
  .tb-xp { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rail {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(86vw, 320px); height: auto; z-index: 50;
    transform: translateX(-102%); transition: transform 0.22s ease; box-shadow: var(--shadow);
    padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .app.menu-open .rail { transform: none; }
  .app.menu-open .scrim { display: block; position: fixed; inset: 0; background: rgba(10, 14, 26, 0.45); z-index: 45; }
  .main { padding-block: 22px 64px; }
  .topics-area.is-open .topics-area-h { top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px)); }
  .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .qbsearch { grid-template-columns: minmax(0, 1fr); }
  .rules { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .next-card { grid-template-columns: auto minmax(0, 1fr); }
  .next-card .btn { grid-column: 1 / -1; }
  .buzz-zone { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .buzzer { width: 130px; height: 130px; font-size: 30px; }
  .scorebar .sb-score { font-size: 40px; }
  .summary-hero { grid-template-columns: minmax(0, 1fr); }
  .qb-fields > div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .lead { font-size: 18px; }
  .fc-actions { grid-template-columns: 1fr 1fr; }
  .fc-actions .fc-flip { grid-column: 1 / -1; order: -1; }
  .chips { gap: 6px 5px; }
  .chip { padding: 5px 11px; font-size: 13px; }
  .topics-area-h { padding: 6px 10px 6px 4px; gap: 2px 12px; }
  .ta-toggle { flex-basis: 100%; padding: 4px 6px; }
  .ta-name { font-size: 18px; }
  .ta-actions { padding: 0 0 4px 30px; }
  .ta-actions .btn { padding: 5px 11px; font-size: 13px; }
  .lib-card.tile-more, .lib-card.tile-soon { min-height: 0; }
  .list-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .list-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; padding: 12px 14px; }
  .list-card-top, .list-label, .list-ready { grid-column: 1; }
  .list-card .btn { grid-column: 2; grid-row: 1 / span 3; align-self: center; margin: 0; }
  .load-error { grid-template-columns: minmax(0, 1fr); gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  .fc-card { transition: none; }
}

<script>
/* ===== QBCORE: pure helpers (no DOM). Kept separate so they can be tested on their own. ===== */
const QBCore = (() => {
  const norm = s => String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/&/g, ' and ').replace(/[’'`]/g, '').replace(/[^a-z0-9$]+/g, ' ').trim().replace(/\s+/g, ' ');

  const lev = (a, b) => {
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    let prev = new Array(n + 1), cur = new Array(n + 1);
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++) {
      cur[0] = i;
      for (let j = 1; j <= n; j++) {
        const cost = a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      [prev, cur] = [cur, prev];
    }
    return prev[n];
  };

  // How many typos we forgive, by length of the official answer.
  const tol = len => (len <= 4 ? 0 : len <= 7 ? 1 : len <= 12 ? 2 : 3);
  const TITLES = /^(?:(?:the|a|an|president|pres|general|gen|captain|capt|admiral|mr|mrs|ms|dr|doctor|sir|dame|lady|lord|king|queen|emperor|empress|prince|princess|archduke|duke|kaiser|tsar|czar|chancellor|pope|saint|st|prophet|chief)\s+)+/;
  const hasPhrase = (hay, needle) => (' ' + hay + ' ').includes(' ' + needle + ' ');
  const LISTS = new WeakMap();
  const lists = topic => {
    let L = LISTS.get(topic);
    if (!L) { L = { acc: topic.accept.map(norm), pr: topic.prompt.map(norm), rej: topic.reject.map(norm) }; LISTS.set(topic, L); }
    return L;
  };

  // One pass over a normalized answer. `hard` marks an explicit do-not-accept match.
  function verdict(a, { acc, pr, rej }) {
    if (rej.includes(a)) return { kind: 'wrong', hard: true };
    if (acc.includes(a)) return { kind: 'right' };
    if (pr.includes(a)) return { kind: 'prompt' };
    if (rej.some(r => r.length > 3 && hasPhrase(a, r))) return { kind: 'wrong', hard: true };
    if (acc.some(x => x.length > 3 && hasPhrase(a, x))) return { kind: 'right' };
    let best = null;
    const consider = (list, kind) => list.forEach(x => {
      const t = tol(x.length);
      if (!t || Math.abs(x.length - a.length) > t) return;
      const d = lev(a, x);
      if (d <= t && (!best || d < best.d)) best = { d, kind };
    });
    consider(rej, 'wrong'); consider(acc, 'right'); consider(pr, 'prompt');
    return best ? { kind: best.kind, hard: best.kind === 'wrong' } : { kind: 'wrong' };
  }
  const RANK = { wrong: 0, prompt: 1, right: 2 };

  // Returns 'right', 'prompt', or 'wrong' for an answer typed against one answer line.
  // The answer is checked as typed and again without a leading title ("King", "Saint", "the"...).
  function judge(input, topic) {
    const raw = norm(input);
    if (!raw) return 'wrong';
    const L = lists(topic), a = verdict(raw, L);
    if (a.hard) return 'wrong';
    const bare = raw.replace(TITLES, '').trim();
    if (!bare || bare === raw) return a.kind;
    const b = verdict(bare, L);
    if (b.hard) return a.kind === 'right' ? 'right' : 'wrong';
    return RANK[a.kind] >= RANK[b.kind] ? a.kind : b.kind;
  }

  // Strip pronunciation guides and italics markers for reading aloud / word-by-word display.
  const plain = s => String(s).replace(/\s*\[“[^”]*”\]/g, '').replace(/_/g, '');
  const words = s => plain(s).split(/\s+/).filter(Boolean);

  // Fill-in-the-blank: hide the longest note keyword that appears in the clue text.
  function cloze(clue) {
    const text = clue.t.replace(/_/g, '');
    let best = null;
    for (const k of clue.k) {
      if (k.length < 4) continue;
      const re = new RegExp('(^|[^A-Za-z0-9])(' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![A-Za-z0-9])', 'i');
      const m = re.exec(text);
      if (m && (!best || m[2].length > best.term.length)) best = { index: m.index + m[1].length, term: m[2] };
    }
    if (!best) return null;
    return { before: text.slice(0, best.index), term: best.term, after: text.slice(best.index + best.term.length) };
  }

  // Which clues from the breakdown appear in a player's notes.
  function catches(notes, topic) {
    const N = ' ' + norm(notes) + ' ';
    return topic.clues.filter(c => c.k.some(k => { const nk = norm(k); return nk && N.includes(nk); })).map(c => c.id);
  }

  return { norm, lev, judge, plain, words, cloze, catches };
})();

  function breakdownHtml(t) {

  function checkNotes(t) {

  /* ---------- BUZZ MODE ---------- */

  const BZ = { q: [], i: 0, cur: null, words: [], pEnd: 0, shown: 0, phase: 'idle', timers: new Set(), score: 0, p: 0, t: 0, n: 0, log: [], buzzAt: -1, power: false, interrupted: false, prompted: false, last: null, token: null, wait: null, pre: null };

  const seg = (act, value, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button class="${String(value) === String(v) ? 'on' : ''}" data-act="${act}" data-v="${v}" aria-pressed="${String(value) === String(v)}">${l}</button>`).join('')}</div>`;
  function viewBuzz() {
    const s = S.settings;
    s.pool = normalizePoolValue(s.pool);
    const canSpeak = speechAvailable();
    show('buzz', `<div class="page">
      <header class="topic-head">
        <p class="eyebrow">Practice match</p>

  // Every tossup in the pool as {id, ix}: never heard first, then ones missed last time, then the rest,

  function buildQueue(ids, count) {
    const groups = [[], [], []];
    ids.forEach(id => {

      for (let ix = 0; ix < n; ix++) {

    const pool = [].concat(...groups.map(shuffle));

  function loadQuestion() {

      <div class="fc-scene"><div class="fc-card ${f.tall ? 'tall' : ''}" id="fcCard" data-act="fc-flip" role="button" tabindex="0" aria-label="Flashcard. Press Space to flip.">
        <div class="fc-face fc-front">${f.front}</div><div class="fc-face fc-back" aria-hidden="true">${f.back}</div></div></div>
      <div class="fc-actions"><button class="btn fc-again" data-act="fc-rate" data-v="0">Again <span class="kbd">1</span></button><button class="btn fc-flip" data-act="fc-flip">Flip <span class="kbd">Space</span></button><button class="btn fc-got" data-act="fc-rate" data-v="1">Got it <span class="kbd">2</span></button></div>`;
  }
  function flip() {
    const el = $('#fcCard'); if (!el) return;
    FC.flipped = !FC.flipped;
    el.classList.toggle('flipped', FC.flipped);
    const front = el.querySelector('.fc-front'), back = el.querySelector('.fc-back');
    if (front) front.setAttribute('aria-hidden', String(FC.flipped));
    if (back) back.setAttribute('aria-hidden', String(!FC.flipped));
  }
  function rateCard(got) {
    if (FC.wait || FC.i >= FC.deck.length) return;
    if (!FC.flipped) { flip(); return; }
    const card = FC.deck[FC.i], key = card.id + ':' + card.cid;
    const r = S.cards[key] || (S.cards[key] = { m: false, n: 0 });
    r.n++; r.t = Date.now();
    TS(card.id).steps.drill = true;
    if (got) { r.m = true; FC.got++; cardsChanged(); touch(2); }
    else { r.m = false; FC.missed++; cardsChanged(); FC.deck.splice(Math.min(FC.deck.length, FC.i + 4), 0, Object.assign({}, card)); save(); }
    paintRailRow(card.id);
    FC.i++; FC.flipped = false;
    paintCard();
  }

  /* ---------- STATS ---------- */
  const toB64 = s => { const bytes = new TextEncoder().encode(s); let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); }); return btoa(bin); };
  const fromB64 = s => { const bin = atob(String(s).replace(/\s+/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))); };
  const started = e => stepsDone(e) > 0 || !!String(TSR(e.id).notes || '').trim();
  function statsRow(e) {
    const ts = TSR(e.id), b = ts.buzz, heard = b.p + b.t + b.n + b.miss;
    const caught = Array.isArray(ts.caught) ? `${ts.caught.length} of ${e.clues}` : ts.paper ? 'On paper' : '—';
    return `<tr><td><a class="stats-topic" href="#topic-${esc(e.id)}">${esc(e.name)}</a></td><td>${stepsDone(e)} of 5</td><td>${caught}</td><td>${pct(mastery(e))}</td><td>${b.p}/${b.t}/${b.n}</td><td>${heard ? Math.round(((b.p + b.t) / heard) * 100) + '%' : '—'}</td></tr>`;
  }
  function viewStats() {
    const lv = level(S.xp), c = S.career;
    const gets = c.p + c.t, acc = c.heard ? Math.round((gets / c.heard) * 100) : 0;
    const mine = myBuiltEntries(), scope = mine.length ? mine : BUILT;
    // Small sets list every topic; big ones (a 450-topic list, or every built topic) list the started ones.
    const listAll = scope.length <= STATS_ALL, scopeIds = new Set(scope.map(e => e.id));
    let shown = 0;
    const statsSections = AREAS.map(a => {
      const rows = BUILT_BY_AREA[a.name].filter(e => scopeIds.has(e.id) && (listAll || started(e)));
      shown += rows.length;
      return rows.length ? `<div class="stats-area"><h3 class="h3">${esc(a.name)}</h3>
        <div class="table-wrap"><table><thead><tr><th>Topic</th><th>Steps</th><th>Clues in notes</th><th>Cards mastered</th><th>P/T/N</th><th>Correct</th></tr></thead>
        <tbody>${rows.map(statsRow).join('')}</tbody></table></div>
      </div>` : '';
    }).join('');
    const what = mine.length ? 'My topics' : 'Every built topic';
    const note = listAll ? `${what}, grouped by area.`
      : shown ? `${what} that you’ve started, grouped by area. ${plural(scope.length - shown, 'more topic')} ${scope.length - shown === 1 ? 'hasn’t' : 'haven’t'} been started yet.`
        : `You haven’t started any of these ${scope.length} topics yet. Open one from Home or the Topics page to begin.`;
    show('stats', `<div class="page">
      <header class="topic-head"><p class="eyebrow">My scoresheet</p><h1 class="display">My Stats</h1><p class="kicker">Level ${lv.n} · ${esc(lv.title)} · ${S.xp} XP</p></header>
      <section class="sec"><div class="stat-grid">
        <div class="stat"><b>${streakNow()}</b><span>Day streak</span></div>
        <div class="stat"><b>${c.p}</b><span>Powers (15 points)</span></div>
        <div class="stat"><b>${c.t}</b><span>Tens (10 points)</span></div>
        <div class="stat"><b>${c.n}</b><span>Negs (−5 points)</span></div>
        <div class="stat"><b>${acc}%</b><span>Correct, of ${plural(c.heard, 'tossup')} heard</span></div>
        <div class="stat"><b>${c.best}</b><span>Best round score</span></div>
      </div></section>
      <section class="sec"><h2>By topic</h2>
        <p class="sec-note">${note}</p>
        ${statsSections}
      </section>
      <section class="sec"><h2>Notes for Coach</h2>
        <p class="sec-note">Coach wants to see your notes at practice. Copy all of them at once, then paste them into an email or a document. Or bring your notebook.</p>
        <div class="row"><button class="btn btn-pen" data-act="copy-notes">Copy all my notes</button></div>
        <textarea id="notesOut" class="code" readonly hidden aria-label="All my notes"></textarea>
      </section>
      <section class="sec"><h2>Back up your progress</h2>
        <p class="sec-note">Your progress lives in this browser on this device. To keep a backup or move to another device, copy your backup code and paste it under “Restore” there.</p>
        <div class="row"><button class="btn" data-act="backup">Copy my backup code</button></div>
        <textarea id="backupOut" class="code" readonly hidden aria-label="Backup code"></textarea>
        <div class="field"><label for="restoreIn">Restore from a backup code</label><textarea id="restoreIn" class="code" placeholder="Paste a backup code here"></textarea></div>
        <div class="row"><button class="btn" data-act="restore">Restore</button></div>
        <div id="restoreMsg"></div>
      </section>
      <section class="sec"><h2>Start over</h2>
        <p class="sec-note">Erase all XP, notes, flashcard piles, and Buzz Mode stats on this device.</p>
        <div id="resetBox"><button class="btn" data-act="reset">Erase my progress…</button></div>
      </section>
    </div>`);
  }
  async function copyOut(text, area, okMsg) {
    try { await navigator.clipboard.writeText(text); toast(okMsg); if (area) { area.hidden = false; area.value = text; } }
    catch (e) { if (area) { area.hidden = false; area.value = text; area.focus(); area.select(); } toast('Select the text and press Ctrl+C (or ⌘C) to copy.'); }
  }
  let pendingRestore = null;

  /* ---------- events ---------- */
  const confirmClearHtml = () => '<button class="btn btn-sm btn-ghost" data-act="my-clear">Clear my topics</button>';
  function selectIds(ids, on) {
    const set = mySet();
    ids.forEach(x => (on ? set.add(x) : set.delete(x)));
    S.my = [...set];
    afterMyChange(ids);
  }
  // Ids an area's Select all / Clear acts on: its search matches while searching, else the whole area.
  const areaTargetIds = area => (areaMatches(area, searchQ()) || BY_AREA[area] || []).map(e => e.id);
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id, t = id ? FULL.get(id) || ENTRY_BY_ID[id] || null : null;
    switch (act) {
      case 'go': go(el.dataset.to); break;
      case 'menu': if ($('#app').classList.toggle('menu-open')) requestAnimationFrame(revealRailItem); break;
      case 'menu-close': closeMenu(); break;
      case 'theme': cycleTheme(); break;
      case 'reload': location.reload(); break;
      case 'topic-retry': route(); break;
      case 'step': { if (!t) break; const ts = TS(t.id), k = el.dataset.step; ts.steps[k] = !ts.steps[k]; if (ts.steps[k]) touch(0); else save(); refreshSteps(t); break; }
      case 'media': if (t) markStep(t, 'learn'); break;
      case 'qb': if (t) markStep(t, 'search'); break;
      case 'read-done': if (!t) break; markStep(t, 'read'); toast('Step 3 done. Now write your notes.'); { const n = $('#s-notes'); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'start' }); } break;
      case 'toggle-answers': { const list = $('#tuList'); if (!list) break; const on = list.classList.toggle('hide-answers'); el.textContent = on ? 'Show answer lines' : 'Hide answer lines'; el.setAttribute('aria-pressed', String(on)); break; }
      case 'say': if (t && t.tossups) sayTossup(t, parseInt(el.dataset.i, 10), el); break;
      case 'check': checkNotes(FULL.get(id)); break;
      case 'paper': paperUnlock(FULL.get(id)); break;
      case 'buzz-topic': S.settings.pool = id; S.settings.count = '15'; save(); go('buzz'); break;
      case 'buzz-all': S.settings.pool = 'all'; save(); go('buzz'); break;
      case 'buzz-my': S.settings.pool = 'my'; save(); go('buzz'); break;
      case 'cards-topic': S.settings.deck = id; S.settings.cardMode = 'auto'; save(); go('cards'); break;
      case 'my-toggle': {
        const on = !S.my.includes(id); setMine(id, on);
        el.textContent = on ? '✓ In my topics' : '+ My topics'; el.classList.toggle('btn-pen', on); el.setAttribute('aria-pressed', String(on));
        const hint = $('#upHint'); if (hint) hint.hidden = on;
        break;
      }
      case 'list-add': {
        const list = LISTS.find(l => String(l.n) === el.dataset.n); if (!list) break;
        const before = mySet().size;
        selectIds(list.ids, true);
        const added = mySet().size - before;
        toast(added ? `Added ${plural(added, 'topic')} to My topics.` : 'Those topics are already in My topics.');
        break;
      }
      case 'lists-toggle': {
        const grid = $('#listGrid'); if (!grid) break;
        TP.listsOpen = grid.hidden; grid.hidden = !TP.listsOpen;
        el.setAttribute('aria-expanded', String(TP.listsOpen)); el.textContent = TP.listsOpen ? 'Hide the lists' : `Show all ${LISTS.length}`;
        break;
      }
      case 'area-select-all': selectIds(areaTargetIds(el.dataset.area), true); break;
      case 'area-clear': selectIds(areaTargetIds(el.dataset.area), false); break;
      case 'my-clear': { const box = $('#myClearBox'); if (box) box.innerHTML = `<div class="confirm"><span>Clear all ${sanitizedMy().length} topics from My topics?</span><button class="btn btn-sm btn-buzz" data-act="my-clear-yes">Yes, clear</button><button class="btn btn-sm btn-ghost" data-act="my-clear-no">Cancel</button></div>`; break; }
      case 'my-clear-yes': { const ids = sanitizedMy(); S.my = []; afterMyChange(ids); toast('Cleared My topics.'); const box = $('#myClearBox'); if (box) box.innerHTML = confirmClearHtml(); break; }
      case 'my-clear-no': { const box = $('#myClearBox'); if (box) box.innerHTML = confirmClearHtml(); break; }
      case 'topics-area': { TP.area = el.dataset.area; $$('#areaChips .chip').forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }); paintTopicsList(); break; }
      case 'ta-toggle': {
        const area = el.dataset.area, sec = el.closest('.topics-area');
        if (!sec || searchQ() || TP.area === area) break; // open while searching or filtered to this area
        TP.open[area] = !TP.open[area];
        paintArea(sec, '', mySet());
        break;
      }
      case 'ta-more': { const area = el.dataset.area, sec = el.closest('.topics-area'); TP.more[area] = true; if (sec) paintArea(sec, searchQ(), mySet()); break; }
      case 'browse-area': TP.area = el.dataset.area; TP.q = ''; go('topics'); break;
      case 'home-more': {
        const area = el.dataset.area, sec = $$('[data-home-area]').find(x => x.dataset.homeArea === area);
        homeMore[area] = true;
        if (sec) sec.outerHTML = homeAreaHtml(area, mySet());
        break;
      }
      case 'rail-toggle': {
        const area = el.dataset.area, nowOpen = el.getAttribute('aria-expanded') !== 'true';
        S.ui.railOpen[area] = nowOpen; save();
        el.setAttribute('aria-expanded', String(nowOpen));
        const body = $$('.lib-area-body').find(b => b.dataset.area === area);
        if (body) {
          body.hidden = !nowOpen;
          if (nowOpen && body.dataset.loaded !== '1') { body.innerHTML = railBodyHtml(area, currentTopicId()); body.dataset.loaded = '1'; }
        }
        break;
      }
      case 'rail-soon': setRailSoon(el.dataset.area, el.getAttribute('aria-expanded') !== 'true'); break;
      case 'bz-start': case 'bz-again': startBuzz(); break;
      case 'bz-setup': viewBuzz(); break;
      case 'bz-buzz': buzz(); break;
      case 'bz-submit': submitAnswer(false); break;
      case 'bz-next': nextQuestion(); break;
      case 'bz-right': overrideRight(); break;
      case 'bz-quit': finishBuzz(true); break;
      case 'bz-retry': if (BZ.phase === 'error') loadQuestion(); break;
      case 'bz-speak': S.settings.speak = el.dataset.v === '1'; save(); el.parentNode.querySelectorAll('button').forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }); break;
      case 'bz-sound': S.settings.sound = el.dataset.v === '1'; save(); el.parentNode.querySelectorAll('button').forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }); if (S.settings.sound) beep('good'); break;
      case 'fc-flip': flip(); break;
      case 'fc-rate': rateCard(el.dataset.v === '1'); break;
      case 'fc-new': newDeck(FC.poolN > FC.ids.length); break;
      case 'fc-reshuffle': newDeck(true); break;
      case 'fc-retry': newDeck(false); break;
      case 'fc-mode': S.settings.cardMode = el.dataset.v; save(); el.parentNode.querySelectorAll('button').forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }); newDeck(false); break;
      case 'fc-mastered': S.settings.withMastered = el.dataset.v === '1'; save(); if (view === 'cards') viewCards(); break;
      case 'copy-notes': {
        const text = ENTRIES.filter(x => String(TSR(x.id).notes || '').trim()).map(x => `${x.name.toUpperCase()}\n${TSR(x.id).notes.trim()}\n`).join('\n');
        if (!text) { toast('No notes yet. Write some on a topic page first.'); break; }
        copyOut(text, $('#notesOut'), 'Notes copied. Paste them anywhere.'); break;
      }
      case 'backup': copyOut(toB64(JSON.stringify(S)), $('#backupOut'), 'Backup code copied.'); break;
      case 'restore': {
        const box = $('#restoreMsg'), raw = ($('#restoreIn') || {}).value || '';
        try {
          const obj = JSON.parse(fromB64(raw));
          if (!obj || obj.v !== 1 || typeof obj.xp !== 'number') throw new Error('bad');
          pendingRestore = obj;
          box.innerHTML = `<div class="confirm"><span>This replaces the progress on this device with the backup (${esc(obj.xp)} XP). Continue?</span><button class="btn btn-sm btn-pen" data-act="restore-yes">Yes, restore</button><button class="btn btn-sm btn-ghost" data-act="restore-no">Cancel</button></div>`;
        } catch (err) { box.innerHTML = '<p class="check-result warn">That code didn’t work. Copy the whole backup code again and paste it here.</p>'; }
        break;
      }
      case 'restore-yes': if (pendingRestore) { S = deepMerge(fresh(), pendingRestore); normalizeState(); pendingRestore = null; save(); applyTheme(); railStale = true; toast('Progress restored.'); viewStats(); } break;
      case 'restore-no': pendingRestore = null; { const box = $('#restoreMsg'); if (box) box.innerHTML = ''; } break;
      case 'reset': { const box = $('#resetBox'); box.innerHTML = '<div class="confirm"><span>Erase everything on this device? This can’t be undone.</span><button class="btn btn-sm btn-buzz" data-act="reset-yes">Yes, erase it</button><button class="btn btn-sm btn-ghost" data-act="reset-no">Keep my progress</button></div>'; break; }
      case 'reset-yes': { const theme = S.settings.theme, touched = S.settings.themeTouched; S = fresh(); S.settings.theme = theme; S.settings.themeTouched = touched; normalizeState(); save(); railStale = true; toast('Progress erased.'); viewStats(); break; }
      case 'reset-no': { const box = $('#resetBox'); box.innerHTML = '<button class="btn" data-act="reset">Erase my progress…</button>'; break; }
      default: break;
    }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'bzPool') { S.settings.pool = el.value; save(); prepareQueue(); }
    else if (el.id === 'bzCount') { S.settings.count = el.value; save(); prepareQueue(); }
    else if (el.id === 'fcDeck') { S.settings.deck = el.value; save(); newDeck(true); }
    else if (el.classList && el.classList.contains('my-check')) { setMine(el.dataset.id, el.checked); }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'bzSpeed') { S.settings.wpm = parseInt(el.value, 10) || 200; const l = $('#bzSpeedLbl'); if (l) l.textContent = S.settings.wpm; saveSoon(); }
    else if (el.classList && el.classList.contains('nb-text')) {
      const ts = TS(el.dataset.id); ts.notes = el.value; saveSoon();
      const cnt = $('#nbCount'); if (cnt) cnt.textContent = plural(noteLines(el.value), 'clue');
    }
    else if (el.id === 'topicsSearch') { TP.q = el.value; TP.more = {}; paintSearchSoon(); }
  });
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
    if (view === 'buzz') {
      if ((e.code === 'Space' || e.key === ' ') && !typing && (BZ.phase === 'reading' || BZ.phase === 'dead')) { e.preventDefault(); buzz(); return; }
      if (e.key === 'Enter' && e.target.id === 'bzAnswer' && BZ.phase === 'answering') { e.preventDefault(); submitAnswer(false); return; }
      if ((e.key === 'n' || e.key === 'N') && !typing && BZ.phase === 'judged') { e.preventDefault(); nextQuestion(); return; }
      if ((e.code === 'Space' || e.key === ' ') && !typing && tag !== 'button' && (BZ.phase === 'answering' || BZ.phase === 'judged' || BZ.phase === 'countdown' || BZ.phase === 'loading')) e.preventDefault();
    } else if (view === 'cards' && !typing) {
      if (e.code === 'Space' || e.key === ' ' || (e.key === 'Enter' && e.target.id === 'fcCard')) { e.preventDefault(); flip(); }
      else if (e.key === '1' || e.key === 'ArrowLeft') { e.preventDefault(); rateCard(false); }
      else if (e.key === '2' || e.key === 'ArrowRight') { e.preventDefault(); rateCard(true); }
    }
    if (e.key === 'Escape') closeMenu();
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('pagehide', save);

  /* ---------- boot ---------- */
  const menuBtn = $('#menuBtn'); if (menuBtn) menuBtn.innerHTML = ICON.menu;
  applyTheme();
  route();
})();

</script>
</body>
</html>
